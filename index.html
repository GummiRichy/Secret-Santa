<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Santa Rounds</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#e5455c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Santa Rounds">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
</head>
<body data-look="candy">
<style>
/* Layout: one phone-width column of chunky "sticker" cards (ink outline + hard drop shadow) over a patterned holiday ground; tab bar docked at the bottom like an app. Each room picks its own ground color. */
:root{
  --ink:#211d3b;
  --paper:#ffffff;
  --muted:#625b7e;
  --line:#e7e2f1;
  --gold:#ffd23f;
  --bg:#e5455c; --bg2:rgba(255,255,255,.12); --pop:#e5455c; --pop2:#32c48d; --soft:#fff0f2;
  --pat:repeating-linear-gradient(135deg,transparent 0 34px,var(--bg2) 34px 68px);
  --patsize:auto;
  --display:"Luckiest Guy","Arial Rounded MT Bold","Trebuchet MS",Impact,sans-serif;
  --body:"Baloo 2",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  --outline:3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 7px 0 var(--ink);
  --outline-sm:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 var(--ink);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
body[data-look="evergreen"]{--bg:#25935a;--pop:#25935a;--pop2:#ffc93c;--soft:#ebf8ef;--pat:radial-gradient(var(--bg2) 3px,transparent 3.6px);--patsize:30px 30px}
body[data-look="frost"]{--bg:#3a74dc;--pop:#3a74dc;--pop2:#8fe3ff;--soft:#eaf2ff;--pat:radial-gradient(var(--bg2) 3px,transparent 3.6px);--patsize:26px 26px}
body[data-look="ginger"]{--bg:#c06a31;--pop:#c06a31;--pop2:#ff9cba;--soft:#fdf0e6;--pat:repeating-linear-gradient(45deg,transparent 0 22px,var(--bg2) 22px 30px)}
body[data-look="plum"]{--bg:#8549d4;--pop:#8549d4;--pop2:#ffd23f;--soft:#f3ebff;--pat:radial-gradient(var(--bg2) 4px,transparent 4.6px);--patsize:36px 36px}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--body);font-size:17px;line-height:1.45;color:var(--ink);background-color:var(--bg);background-image:var(--pat);background-size:var(--patsize);background-attachment:fixed;transition:background-color .5s ease;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
img,svg{max-width:100%}
#snow,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#snow{z-index:0}
#fx{z-index:90}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px}
#view{display:flex;flex-direction:column;gap:20px}

h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.6px;margin:0;line-height:1.02;text-wrap:balance}
h2{font-size:25px}
h3{font-size:19px}
p{margin:0}
.small{font-size:14.5px;color:var(--muted);font-weight:600}
.title{font-family:var(--display);font-weight:400;letter-spacing:.6px;line-height:1.02;margin:0;color:#fff;text-shadow:var(--outline);font-size:clamp(36px,10vw,50px);overflow-wrap:anywhere}
.title.big{font-size:clamp(56px,17vw,86px);line-height:.9}
.onbg{color:#fff;font-weight:700;text-shadow:0 2px 0 rgba(33,29,59,.45)}
.kicker{font-size:15px;text-transform:uppercase;letter-spacing:1.5px}

/* stickers */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.center{align-items:center;text-align:center}
.card.subtle{background:rgba(255,255,255,.92)}
.card.demo{background:#fff8d6}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tilt-l{transform:rotate(-1.2deg)}
.tilt-r{transform:rotate(1deg)}

.btn{font-family:var(--display);font-size:19px;letter-spacing:.6px;line-height:1.1;color:var(--ink);background:var(--pop2);border:3px solid var(--ink);border-radius:16px;padding:12px 18px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;text-align:center;touch-action:manipulation}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.big{font-size:23px;padding:15px 20px}
.btn.white{background:#fff}
.btn.red{background:var(--pop);color:#fff;text-shadow:var(--outline-sm)}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed;font-size:16px}
.btn.ghost:active{transform:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--ink)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}
.btn-row>.btn{flex:1 1 150px}
.chip{font-family:var(--body);font-weight:800;font-size:14px;line-height:1.2;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:5px 12px;box-shadow:0 3px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tag{font-style:normal;font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;border:2px solid var(--ink);border-radius:999px;padding:1px 8px;background:var(--line);color:var(--ink);white-space:nowrap}
.tag.ok{background:var(--pop2)}
.tag.host{background:var(--gold)}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.btn:focus-visible,.chip:focus-visible{outline-color:#fff}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:15.5px}
.field .hint{font-weight:600;font-size:14px;color:var(--muted)}
input[type=text],input[type=number],input[type=datetime-local],textarea,select{font:inherit;font-weight:600;font-size:17px;color:var(--ink);background:var(--soft);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;width:100%;min-width:0;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
textarea{resize:vertical;min-height:84px;line-height:1.4}
input::placeholder,textarea::placeholder{color:#9b94b3;font-weight:500}
input:focus,textarea:focus,select:focus{outline:3px solid var(--pop2);outline-offset:2px}
.money{display:flex;align-items:center;gap:8px}
.money b{font-family:var(--display);font-size:26px}
.money input{max-width:140px}
.codeinput{font-family:var(--display)!important;font-size:34px!important;letter-spacing:8px;text-align:center;text-transform:uppercase}

/* avatars */
.av{display:inline-block;width:var(--s,56px);height:var(--s,56px);border:3px solid var(--ink);border-radius:30%;overflow:hidden;background:#fff;flex:none;box-shadow:0 3px 0 var(--ink)}
.av svg{display:block;width:100%;height:100%}
.av.big{border-width:4px;box-shadow:0 6px 0 var(--ink)}
.bob{animation:bob 3.2s ease-in-out infinite;display:inline-block}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:10px}
.hero .lede{max-width:30ch;font-size:18px}
.room-hero,.giftee-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:4px}
.demo-banner{background:#fff8d6;border:3px dashed var(--ink);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;font-weight:600;font-size:15.5px}
.demo-banner b{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.5px;display:block}
.demo-banner .btn{font-size:15px;padding:7px 12px;box-shadow:0 3px 0 var(--ink);flex:none}

.topbar{display:flex;align-items:center;gap:10px;justify-content:space-between}
.topbar .chip{background:#fff}
.code-chip{font-family:var(--display);font-weight:400;letter-spacing:2px;font-size:16px}

/* rooms list */
.rooms{display:flex;flex-direction:column;gap:10px}
.roomrow{display:flex;align-items:center;gap:12px;background:var(--soft);border:3px solid var(--ink);border-radius:18px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;box-shadow:0 4px 0 var(--ink)}
.roomrow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.roomrow .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.roomrow .meta b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);font-weight:600}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start;font-weight:600}
.steps li::before{content:counter(s);font-family:var(--display);font-size:20px;width:38px;height:38px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:50%;background:var(--gold);box-shadow:0 3px 0 var(--ink);line-height:1;padding-top:3px}
.steps b{font-weight:800}

/* theme picker */
.looks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.look{background:var(--c);border:3px solid var(--ink);border-radius:16px;padding:6px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;box-shadow:0 4px 0 var(--ink);color:#fff;font-weight:800;font-size:11.5px;text-shadow:0 1px 0 var(--ink);min-width:0}
.look .av{--s:44px;box-shadow:none;border-width:2.5px}
.look.on{outline:4px solid var(--ink);outline-offset:2px;transform:translateY(-2px)}
.look span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:2px}

/* phase track */
.track{display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:nowrap}
.track .st{font-weight:800;font-size:13px;background:rgba(255,255,255,.35);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px;white-space:nowrap}
.track .st.done{background:#fff}
.track .st.now{background:var(--gold);box-shadow:0 3px 0 var(--ink)}
.track .ln{width:16px;height:3px;background:var(--ink);flex:none}

/* countdown */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd>div{background:var(--pop);color:#fff;border:3px solid var(--ink);border-radius:16px;text-align:center;padding:8px 0 4px;box-shadow:0 4px 0 var(--ink)}
.cd b{font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,38px);display:block;line-height:1;text-shadow:var(--outline-sm);font-variant-numeric:tabular-nums}
.cd small{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.cd-now{grid-column:1/-1;font-family:var(--display);font-size:24px;text-align:center}

/* crew */
.meter{height:16px;border:3px solid var(--ink);border-radius:999px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;background:repeating-linear-gradient(135deg,var(--pop) 0 10px,#fff 10px 20px);border-right:3px solid var(--ink);transition:width .6s}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.crewmate{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border-radius:16px;min-width:0}
.crewmate:hover{background:var(--soft)}
.crewmate .nm{font-weight:800;font-size:15px;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.crewmate .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.codebig{font-family:var(--display);font-size:clamp(38px,12vw,54px);letter-spacing:8px;text-align:center;background:var(--soft);border:3px dashed var(--ink);border-radius:18px;padding:10px 0 4px}

/* rx pad */
.rx{background:#fff;display:flex;flex-direction:column;gap:12px}
.rx-top{display:flex;gap:12px;align-items:center;border-bottom:3px solid var(--ink);padding-bottom:10px}
.rx-logo{font-family:var(--display);font-size:38px;line-height:1;width:58px;height:58px;display:grid;place-items:center;flex:none;background:var(--pop);color:#fff;border:3px solid var(--ink);border-radius:50%;text-shadow:var(--outline-sm);padding-top:4px;box-shadow:0 3px 0 var(--ink)}
.rx dl{margin:0;display:flex;flex-direction:column;gap:10px}
.rx dt{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--pop)}
.rx dd{margin:0;font-weight:600;border-bottom:2px dashed var(--line);padding-bottom:8px;overflow-wrap:anywhere}
.rx dd.blank{color:#a7a0bd;font-style:italic}
.rx-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sig-line{font-family:var(--display);font-size:17px;color:var(--muted);border-top:2px solid var(--ink);padding-top:4px;letter-spacing:.5px}
.rxsheet{background:#fff;border:3px solid var(--ink);border-radius:20px 20px 20px 20px;box-shadow:0 6px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:14px;background-image:linear-gradient(transparent 0 0);position:relative}
.rxsheet::before{content:"";position:absolute;left:18px;right:18px;top:-11px;height:16px;background:radial-gradient(circle at 8px 8px,var(--ink) 4px,transparent 4.5px) 0 0/26px 16px repeat-x}
.rx-form{display:flex;flex-direction:column;gap:14px}

/* builder */
.preview{display:flex;flex-direction:column;align-items:center;gap:8px}
.preview .nm{font-family:var(--display);font-size:26px;color:#fff;text-shadow:var(--outline-sm);min-height:30px}
.grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.opt{background:var(--soft);border:3px solid var(--ink);border-radius:18px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:800;font-size:12.5px;min-width:0}
.opt .av{--s:54px;box-shadow:none;border-width:2.5px}
.opt.on{background:var(--gold);box-shadow:0 4px 0 var(--ink);transform:translateY(-2px)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--c);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.sw.on{outline:4px solid var(--ink);outline-offset:3px}
.accs{display:flex;gap:8px;flex-wrap:wrap}
.accs .chip.on{background:var(--gold)}

/* recover pick */
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.pick{background:var(--soft);border:3px solid var(--ink);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-weight:800;font-size:14px;min-width:0;overflow-wrap:anywhere;text-align:center}
.pick .av{--s:56px;box-shadow:none}
.pick.on{background:var(--gold);box-shadow:0 4px 0 var(--ink);transform:translateY(-2px) rotate(-2deg)}
.pick:disabled{opacity:.45;cursor:not-allowed}

/* gift */
.giftbtn{background:none;border:0;padding:0;cursor:pointer;width:min(250px,68vw);display:block;margin:4px auto 0}
.giftbtn svg{width:100%;height:auto;overflow:visible;display:block}
.giftbtn .lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .7s cubic-bezier(.3,1.5,.5,1),opacity .5s .25s}
.giftbtn.open .lid{transform:translate(40px,-150px) rotate(32deg);opacity:0}
.giftbtn.shake{animation:shake .5s ease}
.idle-wiggle{animation:wiggle 2.6s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-5deg)}88%{transform:rotate(5deg)}92%{transform:rotate(-3deg)}96%{transform:rotate(2deg)}}
@keyframes shake{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-9deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.08)}60%{transform:rotate(-6deg) scale(1.05)}80%{transform:rotate(4deg)}}
.taps{font-family:var(--display);font-size:20px;color:#fff;text-shadow:var(--outline-sm);letter-spacing:.5px}

/* overlay */
#overlay{position:fixed;inset:0;z-index:70;background:rgba(33,29,59,.95);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.ov-inner{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;max-width:420px;width:100%}
.ov-title{font-size:clamp(30px,9vw,44px)}
.pop-in{animation:popin .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popin{0%{transform:scale(.3) translateY(60px)}100%{transform:scale(1) translateY(0)}}
.sackwrap{position:relative;width:240px;height:240px}
.sack{position:absolute;inset:0}
.sack svg{width:100%;height:100%;overflow:visible}
.sack.go{animation:shake .45s ease-in-out infinite}
.flyer{position:absolute;left:50%;top:40%;margin:-27px 0 0 -27px;animation:fly .9s cubic-bezier(.5,0,.8,.4) both;animation-delay:var(--d)}
.flyer .av{--s:54px}
@keyframes fly{0%{transform:translate(var(--x),var(--y)) scale(1) rotate(0)}100%{transform:translate(0,10px) scale(.15) rotate(360deg);opacity:0}}

/* modal */
#modal .back{position:fixed;inset:0;z-index:60;background:rgba(33,29,59,.6);display:flex;align-items:flex-end;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
#modal .sheet{width:100%;max-width:540px;max-height:88vh;overflow-y:auto;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));animation:sheetup .3s cubic-bezier(.3,1.3,.5,1)}
@keyframes sheetup{0%{transform:translateY(60%)}100%{transform:translateY(0)}}
@media (min-width:700px){#modal .back{align-items:center;padding-bottom:16px}#modal .sheet{border-radius:24px;border-bottom:3px solid var(--ink)}}
.x{position:sticky;top:0;align-self:flex-end;margin:-6px -6px -40px 0;width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 3px 0 var(--ink);line-height:1;z-index:2}
.keybox{font-family:var(--display);font-size:clamp(22px,7vw,30px);letter-spacing:2px;text-align:center;background:var(--gold);border:3px solid var(--ink);border-radius:16px;padding:14px 8px 8px;box-shadow:0 4px 0 var(--ink);overflow-wrap:anywhere;user-select:all}
.pairs{display:flex;flex-direction:column;gap:8px}
.pairrow{display:flex;align-items:center;gap:8px;background:var(--soft);border:2.5px solid var(--ink);border-radius:14px;padding:6px 8px;font-weight:700}
.pairrow .av{--s:34px;box-shadow:none;border-width:2px}
.pairrow .grow{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* mail */
.seg{display:grid;grid-template-columns:1fr 1fr;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:4px;gap:4px;box-shadow:0 5px 0 var(--ink)}
.seg button{border:0;background:transparent;border-radius:13px;padding:9px 6px;font-weight:800;font-size:15px;cursor:pointer;position:relative;line-height:1.15}
.seg button.on{background:var(--pop);color:#fff;text-shadow:0 1px 0 var(--ink)}
.seg .dot{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--gold);color:var(--ink);border:2px solid var(--ink);font-size:11px;margin-left:4px;text-shadow:none;vertical-align:1px}
.thread{display:flex;flex-direction:column;gap:12px;max-height:56vh;min-height:180px;overflow-y:auto;padding:4px 2px 8px;scroll-behavior:auto}
.who-line{display:flex;align-items:center;gap:10px;border-bottom:3px dashed var(--line);padding-bottom:10px}
.who-line .av{--s:46px}

function snow() {
  const c = $('#snow'), ctx = c.getContext('2d'); let W, H, dpr, flakes = [];
  const resize = () => { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  resize(); addEventListener('resize', resize);
  const n = Math.round(Math.min(80, W / 9));
  for (let i = 0; i < n; i++) flakes.push({ x: rnd() * W, y: rnd() * H, r: 1.4 + rnd() * 3.2, s: .25 + rnd() * .9, d: rnd() * 6.28 });
  const draw = t => {
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (const f of flakes) {
      if (!REDUCED) { f.y += f.s; f.x += Math.sin(t / 1400 + f.d) * .35; if (f.y > H + 6) { f.y = -6; f.x = rnd() * W; } if (f.x > W + 6) f.x = -6; if (f.x < -6) f.x = W + 6; }
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
    }
    if (!REDUCED && !document.hidden) requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !REDUCED) requestAnimationFrame(draw); });
}
function confetti(n = 160) {
  if (REDUCED) return;
  const c = $('#fx'), ctx = c.getContext('2d'); const dpr = Math.min(devicePixelRatio || 1, 2); const W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.body); const cols = [cs.getPropertyValue('--pop').trim() || '#e5455c', cs.getPropertyValue('--pop2').trim() || '#32c48d', '#ffd23f', '#ffffff', '#8fe3ff', '#ff9cba'];
  const P = []; for (let i = 0; i < n; i++) P.push({ x: W / 2 + (rnd() - .5) * 80, y: H * .42, vx: (rnd() - .5) * 15, vy: -6 - rnd() * 11, g: .3 + rnd() * .12, w: 6 + rnd() * 8, h: 5 + rnd() * 9, r: rnd() * 6.28, vr: (rnd() - .5) * .35, c: pick(cols), circ: rnd() < .3 });
  const t0 = performance.now();
  const step = t => {
    ctx.clearRect(0, 0, W, H);
    for (const p of P) { p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.strokeStyle = K; ctx.lineWidth = 1.5;
      if (p.circ) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2.4, 0, 6.283); ctx.fill(); ctx.stroke(); } else { ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      ctx.restore(); }
    if (t - t0 < 3600) requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H);
  };
  requestAnimationFrame(step);
}

/* ---------- mail ---------- */
function seenMap() { return LS.get('seen', {}); }
function threadOf(mode) { return S.mine ? (mode === 'out' ? S.mine.tOut : S.mine.tIn) : null; }
function unreadCount(mode) {
  if (!S.mine || S.mine.error || !S.room || S.room.phase === 'lobby') return 0;
  const tid = threadOf(mode), seen = seenMap()[tid] || 0, mine = mode === 'out' ? 'santa' : 'giftee';
  return S.msgs[mode].filter(m => m.role !== mine && m.at > seen).length;
}
function markSeen() {
  if (!S.mine || S.mine.error) return; const tid = threadOf(S.mailMode); const list = S.msgs[S.mailMode]; if (!list.length) return;
  const max = Math.max(...list.map(m => m.at)); const sm = seenMap(); if ((sm[tid] || 0) >= max) return;
  sm[tid] = max; LS.set('seen', sm); renderTabs();
}

function vReveal() {
  const me = myId();

  const santaOf = {}; un.forEach(u => santaOf[u.giftee] = u.id);
  const mySanta = memberById(santaOf[me]);

  const card = mySanta ? `<button class="flip ${flipped ? 'flipped' : ''}" data-act="flip" aria-label="Flip to see your Santa"><div class="in">

  const ids = (S.room.drawnIds || []).filter(id => memberById(id));

  }

  const P = id => { const m = memberById(id); return m ? `${avatarTile(m.av, 36)}<span>${esc(m.name)}</span>` : `${mysteryTile(36)}<span>Someone who left</span>`; };

  <section class="card"><div class="card-h"><h2>Detective board</h2><span class="small">${right} ${right === 1 ? 'sharp eye' : 'sharp eyes'}</span></div>
    <div class="board">${board || '<p class="empty">Nobody guessed this round.</p>'}</div></section>`;
}

/* ================= data flow ================= */
function leaveRoom() { S.subs.forEach(u => { try { u(); } catch (e) {} }); S.subs = []; stopThreads(); }
function stopThreads() { S.threadSubs.forEach(u => { try { u(); } catch (e) {} }); S.threadSubs = []; S.msgs = { out: [], in: [] }; }
function cacheMeta(code, r) {
  S.roomCache[code] = { name: r.name, look: r.look, phase: r.phase };
  const me = getMe(); if (me.rooms[code] && (me.rooms[code].name !== r.name || me.rooms[code].look !== r.look)) { me.rooms[code].name = r.name; me.rooms[code].look = r.look; saveMe(me); }
}
function enterRoom(code, tab = 'hq') {
  leaveRoom();

  const me = getMe(); me.last = code; saveMe(me);
  const base = `rooms/${code}`;
  S.subs.push(B.watchDoc(base, d => { S.room = d; S.loadedRoom = true; if (d) cacheMeta(code, d); effects(); scheduleRender(); }));
  S.subs.push(B.watchCol(base + '/members', l => { S.members = l.sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0)); S.membersLoaded = true; scheduleRender(); }));
  S.subs.push(B.watchCol(base + '/guesses', l => { S.guesses = l; scheduleRender(); }));
  S.subs.push(B.watchCol(base + '/unmask', l => { S.unmasks = l; effects(); scheduleRender(); }));
  const id = myId(); if (id) S.subs.push(B.watchDoc(`${base}/sealed/${id}`, d => { S.sealed = d; unsealMine(); }));
  try { if (location.search) history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
  render();
}
let unsealTok = 0;
async function unsealMine() {
  const sd = S.sealed, ent = myEntry(), tok = ++unsealTok;
  if (!sd || !ent) { if (S.mine) { S.mine = null; stopThreads(); } scheduleRender(); return; }
  if (S.mine && S.mine.round === sd.round) return;
  let mine;
  try { const a = await unseal(ent.jwk, sd.santa), b = await unseal(ent.jwk, sd.giftee); mine = { round: sd.round, gifteeId: a.g, tOut: a.t, kOut: a.k, tIn: b.t, kIn: b.k }; }
  catch (e) { console.warn('unseal failed', e); mine = { round: sd.round, error: true }; }
  if (tok !== unsealTok) return;
  S.mine = mine; startThreads(); effects(); scheduleRender();
}
const DEC = new Map();
function startThreads() {
  S.threadSubs.forEach(u => u()); S.threadSubs = []; S.msgs = { out: [], in: [] };
  const m = S.mine; if (!m || m.error) return;
  const base = `rooms/${S.code}/threads`;
  const watch = (tid, key, slot) => { let loaded = false; return B.watchCol(`${base}/${tid}/msgs`, async list => {
    const out = [];
    for (const d of list) { let p = DEC.get(d.id); if (!p) { try { p = await decObj(key, d); DEC.set(d.id, p); } catch (e) { continue; } } out.push({ id: d.id, at: d.at || 0, ...p }); }
    out.sort((a, b) => a.at - b.at);
    if (S.mine !== m) return;
    const before = S.msgs[slot].length; S.msgs[slot] = out; scheduleRender();
    if (!LIVE) Demo.onMsgs(slot, out);
    const first = !loaded; loaded = true;
    if (!first && out.length > before && (S.tab !== 'mail' || S.mailMode !== slot)) { const last = out[out.length - 1]; if (last.role !== (slot === 'out' ? 'santa' : 'giftee')) toast(slot === 'in' ? (last.kind === 'hint' ? 'New hint from your Santa!' : 'New Elf Mail from your Santa') : 'Your giftee wrote back'); }
  }); };
  S.threadSubs = [watch(m.tOut, m.kOut, 'out'), watch(m.tIn, m.kIn, 'in')];
}
let unmaskSent = '';
function effects() {
  const r = S.room; if (!r) return;

}

/* ---------- draw ---------- */
async function runDraw() {
  const r = S.room, ms = S.members.slice();
  if (ms.length < 3) return toast('You need at least 3 elves for a draw.');
  const ids = ms.map(m => m.id), ex = new Set(r.exclusions || []);
  const bad = (a, b) => a === b || ex.has(pairKey(a, b));
  let perm = null;
  for (let t = 0; t < 4000 && !perm; t++) { const o = shuffle(ids); if (o.every((g, i) => !bad(g, o[(i + 1) % o.length]))) { perm = {}; o.forEach((g, i) => perm[g] = o[(i + 1) % o.length]); } }
  for (let t = 0; t < 30000 && !perm; t++) { const rc = shuffle(ids); if (ids.every((g, i) => !bad(g, rc[i]))) { perm = {}; ids.forEach((g, i) => perm[g] = rc[i]); } }
  if (!perm) { toast("No draw works with those no-match pairs. Remove one and try again."); return false; }
  const round = (r.round || 0) + 1, pubs = Object.fromEntries(ms.map(m => [m.id, m.pub]));
  const asSanta = {}, asGiftee = {};
  for (const g of ids) {
    const rc = perm[g], t = rid(22), k = b64(crypto.getRandomValues(new Uint8Array(32)));
    asSanta[g] = await seal(pubs[g], { g: rc, t, k, round });
    asGiftee[rc] = await seal(pubs[rc], { t, k, round });
  }
  perm = null;
  const base = `rooms/${S.code}`;
  const ops = ids.map(id => ['set', `${base}/sealed/${id}`, { santa: asSanta[id], giftee: asGiftee[id], round }]);
  const [oS, oG, oU] = await Promise.all([B.getCol(base + '/sealed'), B.getCol(base + '/guesses'), B.getCol(base + '/unmask')]);
  oS.filter(d => !ids.includes(d.id)).forEach(d => ops.push(['del', `${base}/sealed/${d.id}`]));
  oG.forEach(d => ops.push(['del', `${base}/guesses/${d.id}`]));
  oU.forEach(d => ops.push(['del', `${base}/unmask/${d.id}`]));
  ops.push(['merge', base, { phase: 'drawn', round, drawnAt: Date.now(), drawnIds: ids }]);
  await B.batch(ops);
  return true;
}
async function drawShow() {
  const ms = S.members;
  overlay(`<div class="ov-inner"><div class="sackwrap"><div class="sack" id="sack">${sackSVG()}</div>${ms.map((m, i) => { const a = rnd() * 6.283, d = 150 + rnd() * 70; return `<span class="flyer" style="--x:${Math.round(Math.cos(a) * d)}px;--y:${Math.round(Math.sin(a) * d - 40)}px;--d:${(i * .13).toFixed(2)}s">${avatarTile(m.av, 54)}</span>`; }).join('')}</div>
    <p class="title ov-title" id="ov-msg">Into the sack…</p><p class="onbg" id="ov-sub">Every elf goes in. Nobody peeks.</p><div id="ov-done" hidden></div></div>`);
  const anim = (async () => {
    await sleep(Math.min(2200, 900 + ms.length * 130));
    const s = $('#sack'); if (s) s.classList.add('go');
    const msg = $('#ov-msg'), sub = $('#ov-sub');
    if (msg) msg.textContent = 'Shaking the sack…'; if (sub) sub.textContent = 'Sealing every match so only its Santa can open it';

  confetti();
}

    else S.join.step = 'code';
    render();
  },
  'open-room'(el) { enterRoom(el.dataset.code); },
  'c-look'(el) { S.create.look = el.dataset.look; keepCreate(); render(); },
  'join-new'() { S.pending = { create: false, look: lookOf(S.join.room) }; S.view = 'profile'; render(); },
  'join-recover'() { S.join.step = 'recover'; S.join.pickId = null; render(); },
  'rec-pick'(el) { S.join.pickId = el.dataset.id; render(); },
  av(el) { S.av = { ...S.av, [el.dataset.k]: el.dataset.v }; const n = $('#p-name'); if (n) S.nick = n.value; render(); },
  tab(el) { S.tab = el.dataset.tab; render(); },
  'mail-to'(el) { S.mailMode = el.dataset.mode || 'out'; S.tab = 'mail'; render(); },
  'mail-mode'(el) { S.mailMode = el.dataset.mode; S.hintOn = false; render(); },
  starter(el) { const ta = $('#m-text'); if (!ta) return; ta.value = (ta.value ? ta.value.trim() + ' ' : '') + el.dataset.text; S.dirty.add('m-text'); const h = $('#m-hint'); if (h) { h.checked = true; S.hintOn = true; } ta.focus(); },
  'copy-text'(el) { copyText(el.dataset.text); },
  'modal-close'() { closeModal(); },
  'modal-back'(el, e) { if (e.target === el) closeModal(); },
  'confirm-yes'() { const r = confirmRes; confirmRes = null; closeModal(); r && r(true); },
  'confirm-no'() { closeModal(); },
  'show-key'() { const e = myEntry(); if (e && e.key) showKey(e.key, false); else toast("This phone doesn't have your key saved."); },
  async 'forget-room'() {
    if (!(await confirmBox('Remove from this phone?', "You'll leave the room on this phone only. Your elf stays in the room, and your Sleigh Key brings it back.", 'Remove'))) return;
    const me = getMe(); delete me.rooms[S.code]; if (me.last === S.code) me.last = null; saveMe(me); A['go-home']();
  },
  rejoin() { const code = S.code; const me = getMe(); delete me.rooms[code]; saveMe(me); leaveRoom(); lookupRoom(code); },
  'view-rx'(el) {
    const m = memberById(el.dataset.id); if (!m) return;
    const canRemove = isHost() && m.id !== myId() && S.room.phase === 'lobby';
    openModal(`${rxPad(m)}${canRemove ? `<button class="btn ghost" data-act="host-remove" data-id="${m.id}">Remove ${esc(m.name)} from the room</button>` : ''}`);
  },
  async 'host-remove'(el) {
    const m = memberById(el.dataset.id); if (!m) return;
    if (!(await confirmBox(`Remove ${esc(m.name)}?`, 'They leave the room and their Rx goes with them. They can rejoin with the code.', 'Remove', true))) return;
    const ex = (S.room.exclusions || []).filter(p => !p.split('|').includes(m.id));
    await B.batch([['del', `rooms/${S.code}/members/${m.id}`], ['merge', `rooms/${S.code}`, { exclusions: ex }]]); toast(`${m.name} was removed`);
  },
  'host-draw'() { drawShow(); },
  async 'host-redraw'() {
    if (!(await confirmBox('Redo the draw?', 'Everyone gets a brand new giftee. All Elf Mail, hints, and guesses from this round are wiped.', 'Redo it', true))) return;
    drawShow();
  },
  async 'host-reveal'() {
    if (!(await confirmBox('Start the big reveal?', "Everyone's Santa gets unmasked and the detective board goes live. Do this on gift day.", 'Reveal!'))) return;
    await B.merge(`rooms/${S.code}`, { phase: 'revealed', revealedAt: Date.now() }); S.tab = 'who'; render(); confetti(220);
  },
  async 'host-unreveal'() {
    if (!(await confirmBox('Back to Elf season?', "Matches stay the same. Santas who already unmasked stay unmasked.", 'Go back'))) return;
    await B.merge(`rooms/${S.code}`, { phase: 'drawn' });
  },
  'host-edit'() { openEdit(); },
  'e-look'(el) { S.editLook = el.dataset.look; document.querySelectorAll('#modal .look').forEach(b => { const on = b.dataset.look === S.editLook; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); }); },
  'e-clear-date'() { const d = $('#e-date'); if (d) d.value = ''; },
  async 'e-save'(el) {
    const name = $('#e-name').value.trim(); if (!name) return toast('Give the room a name.');
    const budget = Math.max(1, Math.min(1000, parseInt($('#e-budget').value, 10) || 25));
    const done = busy(el, 'Saving…');
    try { await B.merge(`rooms/${S.code}`, { name: name.slice(0, 40), budget, exchangeAt: fromLocalInput($('#e-date').value), where: $('#e-where').value.trim().slice(0, 60), look: LOOKS[S.editLook] ? S.editLook : 'candy' }); closeModal(); toast('Room updated'); }
    catch (e) { done(); toast("Couldn't save. Try again."); }
  },
  'host-excl'() { openExcl(); },
  async 'x-add'() {
    const a = $('#x-a').value, b = $('#x-b').value;
    if (!a || !b || a === b) return toast('Pick two different elves.');
    const ex = new Set(S.room.exclusions || []); ex.add(pairKey(a, b));
    await B.merge(`rooms/${S.code}`, { exclusions: [...ex] }); S.room.exclusions = [...ex]; openExcl();
  },
  async 'x-del'(el) { const ex = (S.room.exclusions || []).filter(p => p !== el.dataset.p); await B.merge(`rooms/${S.code}`, { exclusions: ex }); S.room.exclusions = ex; openExcl(); },
  'open-gift'() { giftShow(); },
  'gift-tap'() { giftTap(); },
  'ov-close-giftee'() { closeOverlay(); S.tab = 'giftee'; render(); },
  'ov-giftee'() { closeOverlay(); S.tab = 'giftee'; render(); if (S.mine && !S.mine.error) giftShow(); },
  spin(el) {
    const p = $('#idea-text'); if (!p) return; const budget = +S.room.budget || 25;
    const pool = IDEAS.filter(i => i[0] <= budget * 1.1); const list = pool.length ? pool : IDEAS.slice(0, 6);
    el.disabled = true; p.classList.add('spinning'); let n = 0;
    const iv = setInterval(() => { p.textContent = pick(list)[1]; if (++n > (REDUCED ? 0 : 14)) { clearInterval(iv); const fin = pick(list)[1]; p.textContent = fin; S.idea = fin; p.classList.remove('spinning'); el.disabled = false; } }, 80);
  },
  async guess(el) {
    if (S.room.phase !== 'drawn') return;
    const id = el.dataset.id; const m = memberById(id);
    try { await B.set(`rooms/${S.code}/guesses/${myId()}`, { guess: id, round: S.room.round, at: Date.now() }); toast(`Guess locked: ${m ? m.name : ''}`); } catch (e) { toast("Couldn't save your guess."); }
  },
  flip(el) {
    if (el.classList.contains('flipped')) return;
    el.classList.add('flipped'); const f = LS.get('flipped', {}); f[openedKey()] = true; LS.set('flipped', f);
    setTimeout(() => { confetti(220); scheduleRender(); }, 500);
  },
  'install-dismiss'() { LS.set('installDismissed', true); render(); },
  async 'install-go'() { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; render(); },
  'demo-fill'(el) { Demo.fill(el); },
  async 'demo-reset'() {
    if (!(await confirmBox('Wipe the demo?', 'Every demo room, elf, and message on this device is deleted.', 'Wipe it', true))) return;
    Demo.timers.forEach(clearTimeout); leaveRoom(); B.reset(); ['me', 'bots', 'demost', 'opened', 'flipped', 'seen'].forEach(k => LS.set(k, k === 'me' ? { rooms: {} } : {})); Demo.info = {};
    S.view = 'home'; S.code = null; render(); toast('Demo wiped');
  },
  guide() { openGuide(); }
};
function keepCreate() {
  const v = id => { const e = document.getElementById(id); return e ? e.value : undefined; };
  if (v('c-name') !== undefined) Object.assign(S.create, { name: v('c-name'), budget: v('c-budget'), date: v('c-date'), where: v('c-where') });
}
function openEdit() {
  const r = S.room; S.editLook = lookOf(r);
  openModal(`<h2>Room details</h2>
    ${field('e-name', 'Room name', r.name, 'Anatomy Lab Survivors', false, 40)}
    <div class="field">Room look${looksPicker(S.editLook, 'e-look')}</div>
    <label class="field" for="e-budget">Gift budget<div class="money"><b>$</b><input type="number" id="e-budget" min="1" max="1000" inputmode="numeric" value="${esc(r.budget || 25)}"></div></label>
    <label class="field" for="e-date">Gift day<input type="datetime-local" id="e-date" value="${esc(toLocalInput(r.exchangeAt))}"></label>
    <button type="button" class="chip" data-act="e-clear-date" style="align-self:flex-start">Clear the date (TBD)</button>
    ${field('e-where', 'Where', r.where, 'Study room 3B', false, 60)}
    <div class="btn-row"><button class="btn white" data-act="modal-close">Cancel</button><button class="btn" data-act="e-save">Save</button></div>`);
}
function openExcl() {
  const ex = S.room.exclusions || [];
  const opts = S.members.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
  const rows = ex.map(p => { const [a, b] = p.split('|').map(memberById); if (!a || !b) return ''; return `<div class="pairrow">${avatarTile(a.av, 34)}<span>${esc(a.name)}</span><span>×</span>${avatarTile(b.av, 34)}<span class="grow">${esc(b.name)}</span><button class="chip" data-act="x-del" data-p="${esc(p)}">Remove</button></div>`; }).join('');
  openModal(`<h2>No-match pairs</h2><p>Couples, roommates, or anyone who'd rather not draw each other. The draw keeps these pairs apart in both directions.</p>
    <div class="pairs">${rows || '<p class="empty">No pairs yet.</p>'}</div>
    <div class="two"><label class="field" for="x-a">This elf<select id="x-a">${opts}</select></label><label class="field" for="x-b">won't draw<select id="x-b">${opts}</select></label></div>
    <div class="btn-row"><button class="btn" data-act="x-add">Add pair</button><button class="btn white" data-act="modal-close">Done</button></div>`);
  const b = $('#x-b'); if (b && b.options.length > 1) b.selectedIndex = 1;
}
function openGuide() {
  openModal(`<div class="guide"><h2>Going live (free)</h2>
    <p>Right now Santa Rounds runs in demo mode. To play with real friends, connect it to a free Firebase project and host it on GitHub Pages. The full guide is in the README that came with the files.</p>
    <ol>
      <li>Create a free project at <code>console.firebase.google.com</code> (no credit card).</li>
      <li>Turn on <b>Authentication → Anonymous</b>.</li>
      <li>Create a <b>Firestore Database</b> and paste in the rules from <code>firestore.rules</code>.</li>
      <li>Register a web app and paste its config into <code>config.js</code>.</li>
      <li>Upload the folder to a GitHub repo and turn on <b>Pages</b>. Share the link.</li>
    </ol>
    <button class="btn" data-act="modal-close">Got it</button></div>`);
}

/* ================= forms ================= */
async function lookupRoom(code) {
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 6) { S.join = { step: 'code', code }; S.view = 'join'; render(); if (code) toast('Room codes are 6 characters.'); return; }
  if (getMe().rooms[code]) return enterRoom(code);
  S.view = 'join'; S.join = { step: 'code', code }; render();
  try {
    const room = await B.get(`rooms/${code}`);
    if (!room) { toast("No room with that code. Codes never use O, 0, I, 1, or L."); return; }
    const members = await B.getCol(`rooms/${code}/members`);
    S.join = { step: 'room', code, room, members: members.sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0)) }; render();
  } catch (e) { console.warn(e); toast("Couldn't look that up. Check your connection."); }
}
const F = {
  create() {
    keepCreate();
    const name = (S.create.name || '').trim(); if (!name) { toast('Give your room a name.'); $('#c-name').focus(); return; }
    const budget = Math.max(1, Math.min(1000, parseInt(S.create.budget, 10) || 25));
    S.pending = { create: true, look: S.create.look, room: { name: name.slice(0, 40), look: S.create.look, budget, exchangeAt: fromLocalInput(S.create.date), where: (S.create.where || '').trim().slice(0, 60) } };
    S.view = 'profile'; render();
  },
  'join-code'() { lookupRoom($('#j-code').value); },
  async profile(form) {
    const nick = $('#p-name').value.trim(); S.nick = nick;
    if (!nick) { toast('Tell your crew what to call you.'); $('#p-name').focus(); return; }
    const btn = form.querySelector('button[type=submit]'); const done = busy(btn, 'Wrapping up…');
    try {
      const keys = await genKeys(), sk = makeSleighKey(), wrap = await wrapPriv(keys.priv, sk), memberId = rid(14), p = S.pending;
      let code, roomName, look;
      if (p.create) {
        for (let i = 0; i < 12; i++) { const c = rid(6, CODE_ALPH); if (!(await B.get(`rooms/${c}`))) { code = c; break; } }
        if (!code) throw new Error('no code');
        await B.set(`rooms/${code}`, { ...p.room, hostId: memberId, phase: 'lobby', round: 0, exclusions: [], drawnIds: [], createdAt: Date.now() });
        roomName = p.room.name; look = p.room.look;
      } else { code = S.join.code; roomName = S.join.room.name; look = lookOf(S.join.room); }
      await B.set(`rooms/${code}/members/${memberId}`, { name: nick.slice(0, 24), av: { c: S.av.c, col: S.av.col, acc: S.av.acc }, pub: keys.pub, wrap, wish: null, joinedAt: Date.now() });
      const me = getMe(); me.rooms[code] = { memberId, jwk: keys.priv, key: sk, name: roomName, look }; saveMe(me);
      S.pending = null; S.join = null; S.create = { look: 'candy' };
      enterRoom(code, p.create ? 'hq' : 'rx'); showKey(sk, true); confetti(120);
    } catch (e) { console.error(e); done(); toast("Couldn't save your elf. Check your connection and try again."); }
  },
  async recover(form) {
    const j = S.join; const m = j.members.find(x => x.id === j.pickId);
    if (!m) return toast('Tap your elf first.');
    const key = $('#r-key').value; if (normKey(key).length < 8) return toast('Enter your full Sleigh Key.');
    const done = busy(form.querySelector('button[type=submit]'), 'Checking the key…');
    try {
      const jwk = await unwrapPriv(m.wrap, key);
      const me = getMe(); me.rooms[j.code] = { memberId: m.id, jwk, key: key.toUpperCase().trim(), name: j.room.name, look: lookOf(j.room) }; saveMe(me);
      S.join = null; enterRoom(j.code); toast(`Welcome back, ${m.name}!`);
    } catch (e) { done(); toast("That Sleigh Key didn't fit. Check the words and number."); }
  },
  async rx(form) {
    const v = id => $('#' + id).value.trim();
    const wish = { loves: v('rx-loves'), nope: v('rx-nope'), allergies: v('rx-allergies'), sizes: v('rx-sizes'), sig: v('rx-sig') };
    if (!wish.loves) { toast('Add at least one thing you\'d love.'); $('#rx-loves').focus(); return; }
    const done = busy(form.querySelector('button[type=submit]'), 'Filling…');
    try { await B.merge(`rooms/${S.code}/members/${myId()}`, { wish, wishAt: Date.now() }); S.dirty.clear(); done(); toast('Rx filled! Your Santa thanks you.'); }
    catch (e) { done(); toast("Couldn't save. Try again."); }
  },
  async mail(form) {
    const ta = $('#m-text'); const text = ta.value.trim(); if (!text || !S.mine || S.mine.error) return;
    const out = S.mailMode === 'out'; const hint = out && $('#m-hint') && $('#m-hint').checked;
    const btn = form.querySelector('button[type=submit]'); btn.disabled = true;
    try {
      const enc = await encObj(out ? S.mine.kOut : S.mine.kIn, { role: out ? 'santa' : 'giftee', kind: hint ? 'hint' : 'msg', text: text.slice(0, 500) });
      await B.add(`rooms/${S.code}/threads/${out ? S.mine.tOut : S.mine.tIn}/msgs`, { ...enc, at: Date.now() });
      ta.value = ''; S.dirty.delete('m-text'); S.hintOn = false; const h = $('#m-hint'); if (h) h.checked = false;
      if (hint) toast('Hint dropped!');
    } catch (e) { toast("Couldn't send. Try again."); }
    btn.disabled = false;
  }
};

/* ================= wiring ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.dataset.act !== 'modal-back') e.stopPropagation();
  fn(el, e);
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); const fn = F[f.dataset.form]; if (fn) fn(f); });
document.addEventListener('input', e => {
  const t = e.target; if (t.id) S.dirty.add(t.id);
  if (t.id === 'j-code') t.value = t.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (t.id === 'p-name') { S.nick = t.value; const n = $('#pv-name'); if (n) n.textContent = t.value; }
  if (t.id === 'm-hint') S.hintOn = t.checked;
});
document.addEventListener('change', e => { if (e.target.id === 'm-hint') S.hintOn = e.target.checked; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').innerHTML) closeModal(); });
setInterval(() => document.querySelectorAll('[data-cd]').forEach(el => { el.innerHTML = cdInner(+el.dataset.cd); }), 1000);
setInterval(() => { if (S.view === 'room' && (S.tab === 'mail' || S.tab === 'who')) scheduleRender(); }, 60000);

async function refreshRoomCache() {
  const codes = Object.keys(getMe().rooms);
  await Promise.all(codes.map(async c => { try { const r = await B.get(`rooms/${c}`); if (r) cacheMeta(c, r); } catch (e) {} }));
  if (S.view === 'home') scheduleRender();
}
async function boot() {
  snow(); render();
  B = LIVE ? FireBackend(CFG) : MockBackend();
  try { await B.init(); } catch (e) { console.error(e); S.view = 'error'; S.err = e && e.message; render(); return; }
  if (LIVE && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  let code = null; try { code = new URLSearchParams(location.search).get('room'); } catch (e) {}
  if (code) { lookupRoom(code); return; }
  const me = getMe();
  if (me.last && me.rooms[me.last]) { enterRoom(me.last); return; }
  S.view = 'home'; render(); refreshRoomCache();
}
boot();
})();
</script>
